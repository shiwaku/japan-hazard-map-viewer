<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>全国ハザードマップ</title>
  </head>
  <body>
    <div id="map"></div>

    <!-- ハザードマップ種別の選択（ラジオは layer-switcher が生成） -->
    <div id="info">
      <details>
        <summary class="yubi"><strong>ハザードマップの種類</strong></summary>
        <fieldset>
          <div class="radio-button-container">
            <div class="column" id="layer-radios"></div>
          </div>
        </fieldset>
      </details>
    </div>

    <!-- 不透明度スライダー -->
    <div class="map-overlay top">
      <div class="map-overlay-inner">
        <label>ハザードマップ 不透明度: <span id="slider-opacity-value">80%</span></label>
        <input id="slider-opacity" type="range" min="0" max="100" step="1" value="80" />
      </div>
    </div>

    <!-- 凡例（legend が生成） -->
    <div id="legends"></div>

    <!-- 避難経路の速度プロファイル -->
    <div class="control-panel">
      <h4>避難経路</h4>
      <button id="carButton" type="button">自動車</button>
      <button id="personButton" type="button">一般の人</button>
      <button id="elderlyButton" type="button">高齢者</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
